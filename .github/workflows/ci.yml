name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: oga9
          POSTGRES_PASSWORD: oga9
          POSTGRES_DB: oga9
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oga9"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      OGA9_TEST_DATABASE_URL: postgres://oga9:oga9@localhost:5432/oga9?sslmode=disable
      OGA9_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
        # .oos (engineering spec) is not a build dependency — skip submodules
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: fmt check
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: apply migrations
        run: |
          for f in db/migrations/*.up.sql; do
            psql "$OGA9_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: sqlc generated files in sync
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code internal/db
      - name: test
        run: go test ./... -count=1

  # §13 hardening 13.02 — prove backup.sh + restore.sh round-trip: migrate a
  # scratch DB, seed a marker row, dump, wipe the schema, restore, verify.
  restore-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: oga9
          POSTGRES_PASSWORD: oga9
          POSTGRES_DB: oga9
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oga9"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OGA9_DATABASE_URL: postgres://oga9:oga9@localhost:5432/oga9?sslmode=disable
      OGA9_BACKUP_DIR: /tmp/oga9-backups
    steps:
      - uses: actions/checkout@v4
      - name: install pg client (PGDG 18 — must match the pg18 service image)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgres.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
      - name: apply migrations
        run: |
          for f in db/migrations/*.up.sql; do
            psql "$OGA9_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: seed marker row
        run: psql "$OGA9_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
          "INSERT INTO users (id,email,password_hash,display_name,status) VALUES (gen_random_uuid(),'restore-test@oga9.local','x','RT','active')"
      - name: backup
        run: scripts/backup.sh
      - name: wipe schema
        run: psql "$OGA9_DATABASE_URL" -v ON_ERROR_STOP=1 \
          -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
      - name: restore
        run: scripts/restore.sh "$(ls -t $OGA9_BACKUP_DIR/oga9-*.dump | head -1)"
      - name: verify marker row survived
        run: |
          psql "$OGA9_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            "SELECT count(*) FROM users WHERE email='restore-test@oga9.local'" | grep -qx 1

  # §14.04 self-host packaging validation: the bundle's golang-migrate path
  # (not raw psql) must apply cleanly on install AND no-op on re-upgrade,
  # and the oga9 image must build.
  selfhost-upgrade-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: oga9
          POSTGRES_PASSWORD: oga9
          POSTGRES_DB: oga9
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oga9"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: install (golang-migrate up — self-host path)
        run: |
          docker run --rm --network host             -v "$PWD/db/migrations:/migrations:ro"             migrate/migrate:v4.18.3             -path /migrations             -database "postgres://oga9:oga9@localhost:5432/oga9?sslmode=disable"             up
      - name: upgrade (re-run migrate — must no-op, not fail)
        run: |
          docker run --rm --network host             -v "$PWD/db/migrations:/migrations:ro"             migrate/migrate:v4.18.3             -path /migrations             -database "postgres://oga9:oga9@localhost:5432/oga9?sslmode=disable"             up
      # §09 release discipline: rollback must be real — every .down.sql
      # reverses cleanly on the bundled migrate path.
      - name: rollback (migrate down -all → up again)
        run: |
          docker run --rm --network host             -v "$PWD/db/migrations:/migrations:ro"             migrate/migrate:v4.18.3             -path /migrations             -database "postgres://oga9:oga9@localhost:5432/oga9?sslmode=disable"             down -all
          docker run --rm --network host             -v "$PWD/db/migrations:/migrations:ro"             migrate/migrate:v4.18.3             -path /migrations             -database "postgres://oga9:oga9@localhost:5432/oga9?sslmode=disable"             up
      - name: image builds (oga9:{version})
        run: docker build -t oga9:ci-test .
      # §14.04 release validation: the bundle must actually BOOT — a
      # config/env mismatch (e.g. a control-plane-only required var)
      # crashes the api on install and nothing else here would catch it.
      - name: self-host bundle boots (install path)
        working-directory: deploy/selfhost
        run: |
          cp .env.example .env
          sed -i "s|^OGA9_VERSION=.*|OGA9_VERSION=ci-test|" .env
          sed -i "s|^OGA9_JWT_SECRET=.*|OGA9_JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^OGA9_DB_PASSWORD=.*|OGA9_DB_PASSWORD=$(openssl rand -hex 16)|" .env
          echo "OGA9_MIGRATIONS_DIR=$GITHUB_WORKSPACE/db/migrations" >> .env
          printf '{}' > license.json
          docker compose --env-file .env up -d
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          docker compose --env-file .env logs api
          exit 1
      - name: teardown
        if: always()
        working-directory: deploy/selfhost
        run: docker compose --env-file .env down -v --remove-orphans || true
